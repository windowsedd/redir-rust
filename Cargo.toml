[package]
name = "redir-rust"
version = "0.1.0"
edition = "2021"
description = "A Rust-based port redirector with plugin support, inspired by redir"
license = "MIT"

[lib]
name = "redir_rust"
path = "src/lib.rs"

[[bin]]
name = "redir-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "1"
bytes = "1"
toml = "0.8"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
